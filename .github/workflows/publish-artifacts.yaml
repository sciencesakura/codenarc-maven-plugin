name: publish artifacts

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to publish. Defaults to the commit that triggered the caller workflow.
        type: string
        default: ''
      skip-tests:
        description: Skip compiling and running tests.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v6
        with:
          java-version-file: .java-version
          distribution: zulu
          cache: maven
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          mvn-server-repository-origins: |
            central:https://central.sonatype.com
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      - run: ./mvnw -e --batch-mode -P deploying deploy -Djacoco.skip=true $SKIP_TESTS_ARGS
        env:
          SKIP_TESTS_ARGS: ${{ inputs.skip-tests && '-Dmaven.test.skip=true -Dinvoker.skip=true' || '' }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
