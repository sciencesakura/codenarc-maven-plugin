name: publish snapshot

on:
  workflow_run:
    workflows:
      - build
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check-version:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      is-snapshot: ${{ steps.version.outputs.is-snapshot }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-java@v6
        with:
          java-version-file: .java-version
          distribution: zulu
          cache: maven
      - id: version
        run: |
          version=$(./mvnw --batch-mode --quiet help:evaluate -Dexpression=project.version -DforceStdout)
          echo "project.version: $version"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "is-snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-snapshot=false" >> "$GITHUB_OUTPUT"
          fi

  publish-artifacts:
    needs: check-version
    if: needs.check-version.outputs.is-snapshot == 'true'
    uses: ./.github/workflows/publish-artifacts.yaml
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
      skip-tests: true
    secrets: inherit
