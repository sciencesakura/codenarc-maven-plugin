name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  verify-version:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify that the tag matches the project version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version=$(yq -p xml -o yaml '.project.version' pom.xml)
          echo "tag: $TAG_NAME, project.version: $version"
          if [[ "$TAG_NAME" != "v$version" ]]; then
            echo "::error::Tag '$TAG_NAME' does not match project.version '$version' (expected 'v$version')."
            exit 1
          fi

  publish-artifacts:
    needs: verify-version
    if: >-
      !cancelled() && (
        needs.verify-version.result == 'success' ||
        needs.verify-version.result == 'skipped'
      )
    uses: ./.github/workflows/publish-artifacts.yaml
    secrets: inherit
